function pageCost(after){
  const g = guard(); if(g) return head("Question 2","Cost","What does the plan cost in materials, and what does the gap cost to close?") + g;
  const r = S.result, c = r.cost, fgs = c.per_fg.map(x=>x.fg);
  if(!S.ui.costFg || !fgs.includes(S.ui.costFg)) S.ui.costFg = fgs[0];
  const sel = c.per_fg.find(x=>x.fg===S.ui.costFg);
  const ar = c.at_risk;
  const tone = c.missing_costs.length ? "partial" : "info";
  const toTrace = p => { if(S.result.raw_materials.includes(p.name)) showTrace(p.name); };
  after.push(() => chart("ch-wf", waterfallOption(sel))?.on("click", toTrace));
  after.push(() => chart("ch-pareto", paretoOption(c, 10))?.on("click", toTrace));
  const partial = c.missing_costs.length ? " (partial)" : "";
  const sub = ar ? (ar.dollars!=null ? `Revenue at risk: ${money(ar.dollars)} from ${fmtInt(ar.units_total)} units still unmet after week ${r.horizon}.` : `${fmtInt(ar.units_total)} units are still unmet after week ${r.horizon}; add selling prices to value them.`) : "";
  const fgSel = `<select class="sel small filter" data-change="cost-fg" title="Filter">${fgs.map(f=>`<option ${f===S.ui.costFg?"selected":""}>${esc(f)}</option>`).join("")}</select>`;
  return head("Question 2","Cost",`Material cost of the ${r.horizon}-week plan, scrap, the cost to close shortfalls, and revenue at risk.`, pageBtns("cost","cost-summary"))
    + answer(tone, c.answer, sub) + readinessPanel("cost")
    + `<div class="grid g4" style="margin-bottom:14px">${kpi("Plan material cost"+partial, moneyShort(c.plan_cost), `${r.horizon} weeks of demand, incl. scrap`)}
      ${kpi("Scrap cost"+partial, moneyShort(c.plan_scrap_cost), c.plan_cost?fmtPct(c.plan_scrap_cost/c.plan_cost)+" of material cost":"")}
      ${kpi("Cost to cover shortfalls", moneyShort(c.shortfall_cost), c.shortfall_lines.some(l=>l.unit_cost==null)?"some shortfall costs unknown":`${c.shortfall_lines.length} material${c.shortfall_lines.length===1?"":"s"} to buy`)}
      ${kpi("Revenue at risk", ar?.dollars!=null?moneyShort(ar.dollars):"–", ar?`${fmtInt(ar.units_total)} units unmet after week ${r.horizon}`:"needs weekly demand")}</div>`
    + `<div class="grid g2" style="margin-bottom:14px"><div class="card">${chartHead("Unit cost build-up", `${esc(plabel(sel.fg))}: ${money(sel.unit_cost,2)} per unit${sel.complete?"":" (partial: "+sel.missing_costs.length+" costs missing)"}${sel.selling_price!=null?` · sells for ${money(sel.selling_price,2)}`:""}`, "cost-waterfall", fgSel)}<div id="ch-wf" class="chart"></div></div>
      <div class="card">${chartHead("Where the plan's material money goes", "Top materials by plan spend, with cumulative share.", "cost-pareto")}<div id="ch-pareto" class="chart"></div></div></div>`
    + `<div class="card" style="margin-bottom:14px">${table("cost-fg", [
        {k:"fg",label:"Finished good",fmt:x=>`<b>${esc(x.fg)}</b> <span class="muted">${esc(desc(x.fg))}</span>`},
        {k:"planned",label:`Demand (${r.horizon} wk)`,num:true,fmt:x=>fmtInt(x.planned)},
        {k:"unit_cost",label:"Unit material cost",num:true,fmt:x=>money(x.unit_cost,2)+(x.complete?"":" *")},
        {k:"scrap_cost",label:"Scrap per unit",num:true,fmt:x=>money(x.scrap_cost,2)},
        {k:"selling_price",label:"Selling price",num:true,fmt:x=>money(x.selling_price,2)},
        {k:"margin",label:"Material margin",num:true,fmt:x=>x.margin==null?"–":money(x.margin,2)},
        {k:"plan_cost",label:"Plan cost",num:true,fmt:x=>money(x.plan_cost)}], c.per_fg, {title:"By finished good", note:c.missing_costs.length?"* partial: some unit costs missing":"", maxh:false})}</div>`
    + (c.shortfall_lines.length ? `<div class="card">${table("cost-short", [
        {k:"part",label:"Material",fmt:x=>`<b>${esc(x.part)}</b> <span class="muted">${esc(desc(x.part))}</span>`},

        {k:"shortfall",label:`Shortfall over ${r.horizon} wk`,num:true,fmt:x=>fmt(x.shortfall)},
        {k:"unit_cost",label:"Unit cost",num:true,fmt:x=>money(x.unit_cost,2)},

function waterfallOption(sel, big = false){
  const fs = big ? 15 : 11.5;
  const lines = sel.lines.slice(); const top = lines.slice(0, 7), rest = lines.slice(7);
  const items = top.map(l => [l.part, l.cost_no_scrap]);
  if(rest.length) items.push([`Other (${rest.length})`, rest.reduce((a,l)=>a+l.cost_no_scrap,0)]);
  items.push(["Scrap", sel.scrap_cost]);
  let run = 0; const base = [], val = [];
  items.forEach(([,v]) => { base.push(run); val.push(v); run += v; });
  const cats = items.map(i=>i[0]).concat(["Unit cost"]);
  base.push(0); val.push(run);
  return {grid:{left:big?70:56,right:16,top:16,bottom:big?70:60}, tooltip:{trigger:"axis",axisPointer:{type:"shadow"},formatter:p=>{const i=p[1].dataIndex;return `<b>${esc(cats[i])}</b> ${esc(desc(cats[i]))}<br>${money(val[i],2)}`;}},
    xAxis:{type:"category",data:cats,axisLabel:{interval:0,rotate:35,fontSize:fs,color:COLORS.ink}},
    yAxis:{type:"value",axisLabel:{formatter:v=>"$"+v,fontSize:fs},splitLine:{lineStyle:{color:COLORS.grid}}},
    series:[{type:"bar",stack:"w",itemStyle:{color:"transparent"},data:base,silent:true},
      {type:"bar",stack:"w",barMaxWidth:46,data:val.map((v,i)=>({value:v,itemStyle:{color:i===val.length-1?COLORS.ink:cats[i]==="Scrap"?COLORS.amber:COLORS.accent,borderRadius:3}})),
       label:{show:true,position:"top",fontSize:fs-1,color:COLORS.ink2,formatter:p=>money(p.value, p.value<10?2:0)}}]};
}
function paretoOption(c, n, big = false){
  const fs = big ? 15 : 11.5; const spend = {};
  c.per_fg.forEach(f => f.lines.forEach(l => spend[l.part] = (spend[l.part]||0) + l.cost * (f.planned || 0)));
  const all = Object.entries(spend).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]); const total = all.reduce((a,b)=>a+b[1],0);
  const rows = all.slice(0, n); let cum = 0; const cumv = rows.map(r => (cum += r[1]) / (total || 1));
  return {grid:{left:big?80:60,right:big?60:46,top:20,bottom:big?60:50}, tooltip:{trigger:"axis",formatter:p=>`<b>${esc(p[0].name)}</b> ${esc(desc(p[0].name))}<br>Plan spend ${money(p[0].value)}<br>Cumulative ${fmtPct(p[1]?.value)}`},
    xAxis:{type:"category",data:rows.map(r=>r[0]),axisLabel:{interval:0,rotate:35,fontSize:fs,color:COLORS.ink}},
    yAxis:[{type:"value",axisLabel:{formatter:v=>moneyShort(v),fontSize:fs},splitLine:{lineStyle:{color:COLORS.grid}}},{type:"value",max:1,axisLabel:{formatter:v=>Math.round(v*100)+"%",fontSize:fs},splitLine:{show:false}}],
    series:[{type:"bar",name:"Plan spend",barMaxWidth:40,data:rows.map(r=>r[1]),itemStyle:{color:COLORS.accent,borderRadius:[3,3,0,0]}},
      {type:"line",name:"Cumulative share",yAxisIndex:1,data:cumv,symbolSize:6,lineStyle:{color:COLORS.amber,width:2},itemStyle:{color:COLORS.amber}}]};
}

function closeLayer(){ $("#layer").innerHTML = ""; }

function showTrace(part){
  let t; try{ t = call("trace", S.state, part); }catch(e){ return toast(e.message); }
  const L = S.result.weeks, wk = t.weekly;
  const paths = t.paths.map(p => {
    const eq = [`${fmt(p.fg_qty,0)} × ${esc(p.fg)}`].concat(p.steps.map(s => {
      const bits = [`${fmt(s.qty_per,6)}${s.uom?" "+esc(s.uom):""}`]; if(s.conversion!==1) bits.push(`× ${fmt(s.conversion,6)} conv`); if(s.scrap!==1) bits.push(`× ${fmt(s.scrap,6)} scrap`);
      return `× ${bits.join(" ")} <span class="muted">(${esc(s.child)})</span>`; })).join("<br>");
    return `<div class="path"><div class="eq">${eq}<br>= <b>${fmt(p.result, 6)} ${esc(t.uom)}</b></div><div class="src">${p.steps.map(s=>`${esc(s.parent)} > ${esc(s.child)}: ${esc(s.source)} row ${s.row}`).join(" · ")}</div></div>`; }).join("");
  const weekly = wk ? `<table class="t" style="margin:4px 0 14px"><thead><tr><th></th>${L.map(l=>`<th class="num">${esc(l)}</th>`).join("")}</tr></thead><tbody>
    <tr><td class="muted">Required</td>${wk.required.map(v=>`<td class="num">${fmt(v)}</td>`).join("")}</tr>

    <div class="small muted" style="margin-bottom:10px">Starts with ${fmt(wk.on_hand)} ${esc(t.uom)} on hand. Used in ${wk.fgs.map(esc).join(", ")}.</div>` : "";
  openDrawer(`Trace: ${esc(part)}`, `<div class="small muted">${esc(desc(part))}</div><div style="font-size:22px;font-weight:700;margin:6px 0 2px">${fmt(t.total, 6)} ${esc(t.uom)}</div>
    <div class="small muted" style="margin-bottom:10px">Needed for ${S.result.horizon} weeks of demand, summed over ${fmtInt(t.path_count)} path${t.path_count===1?"":"s"}${t.truncated?` (first ${t.paths.length} shown)`:""}.</div>
    ${weekly}<h3 style="font-size:14px;margin:0 0 6px">How the total is built</h3><div class="small muted" style="margin-bottom:8px">Each path multiplies the ${S.result.horizon}-week demand by every BOM line it passes through. Every factor comes from the row cited under it.</div>${paths}`);

    <div class="card"><h3>About</h3><div class="small" style="line-height:1.6">BOM Gap Analyzer, engine v${esc(S.schema.version)}. Runs entirely in your browser; no data is uploaded. Decision support only; the ERP remains the system of record.</div></div></div>`);
}

async function networkImage(fg){
  const host = document.createElement("div"); host.className = "capture"; host.style.width = "1160px"; host.style.height = "500px"; document.body.appendChild(host);
  const {nodes, elements} = networkElements(fg);
  const cy = cytoscape({container:host, elements, style:cyStyle(true), layout:cyLayout(nodes)});
  await new Promise(r => setTimeout(r, 60));
  const url = cy.png({full:true, scale:2, bg:"#ffffff", maxWidth:2320, maxHeight:1000});
  cy.destroy(); host.remove(); return url;
}
async function renderCard(spec){
  const toneC = {green:COLORS.green, red:COLORS.red, amber:COLORS.amber, blue:COLORS.accent}[spec.tone];
  const rd = spec.mod ? S.result.readiness?.[spec.mod] : null;
  const partial = rd?.status === "partial" ? `<div class="pnote">Partial answer. Missing: ${esc(rd.message)}</div>` : "";
  const wide = spec.wide || !spec.kpis.length;
  const visual = spec.image ? `<div style="height:${wide?500:440}px;display:flex;align-items:center;justify-content:center"><img src="${spec.image}" style="max-width:100%;max-height:100%"></div>`
    : `<div class="pchart" id="pchart" style="${wide?"height:500px":""}"></div>`;
  const el = document.createElement("div"); el.className = "capture";
  el.innerHTML = `<div class="pcard"><div class="pk">${esc(spec.kicker)}</div><div class="ph"><span class="tone" style="background:${toneC}"></span>${esc(spec.headline)}</div>
    <div class="pbody" style="${wide?"grid-template-columns:1fr":""}"><div>${spec.chartTitle?`<div style="font-size:14px;color:#4A5568;font-weight:600;margin-bottom:4px">${esc(spec.chartTitle)}</div>`:""}${visual}${wide?partial:""}</div>
    ${!wide?`<div class="pk-list">${spec.kpis.map(([l,v])=>`<div class="pkpi"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div></div>`).join("")}${partial}</div>`:""}</div>
    <div class="pfoot"><span><b>Plan:</b> ${esc(S.result.weeks?.[0]||"")} to ${esc(S.result.weeks?.[S.result.horizon-1]||"")}</span><span><b>Sources:</b> ${esc(sources())}</span><span><b>Prepared:</b> ${new Date().toLocaleDateString()}</span><span style="margin-left:auto">Decision support; ERP is the system of record</span></div></div>`;
  document.body.appendChild(el);
  let c = null;
  if(spec.chart){ c = echarts.init(el.querySelector("#pchart"), null, {renderer:"canvas"}); c.setOption(Object.assign({animation:false, textStyle:{fontFamily:"Inter, system-ui, sans-serif"}}, spec.chart)); }
  if(spec.image) await Promise.all([...el.querySelectorAll("img")].map(i => i.complete ? 0 : new Promise(r => { i.onload = r; i.onerror = r; })));
  await new Promise(r => setTimeout(r, 120));
  try{ const canvas = await html2canvas(el.firstElementChild, {scale:1.5, backgroundColor:"#ffffff", logging:false}); return canvas.toDataURL("image/png"); }
  finally{ c && c.dispose(); el.remove(); }
}
async function addCard(id){

function exportXlsx(mod){
  const r = S.result; if(!r || r.blocked) return toast("Nothing to export yet.");
  const wb = XLSX.utils.book_new(); const add = (name, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{note:"no rows"}]), name.slice(0,31));
  const meta = [{Item:"Project",Value:S.state.name},{Item:"Plan",Value:`${r.weeks?.[0]} to ${r.weeks?.[r.horizon-1]}`},{Item:"Sources",Value:sources()},{Item:"Exported",Value:new Date().toISOString()},{Item:"Engine",Value:r.engine},{Item:"Precision",Value:"Full precision, unrounded"}];
  const L = r.weeks || [];
  if(mod === "feasibility"){ const f = r.feasibility;
    add("Weekly plan", f.finished_goods.flatMap(x => x.weeks.map((k,w) => ({"Finished good":x.fg,Week:L[w],Demand:k.demand,"Backlog in":k.backlog_in,Built:k.built,"Built on time":k.on_time,"Backlog filled":k.late_filled,"Short at week end":k.short}))));
    add("Materials by week", f.materials.flatMap(m => L.map((l,w) => ({Material:m.part,Description:m.description,Unit:m.uom,Week:l,Receipts:m.receipts[w],Required:m.required[w],"Ending balance":m.balance[w],"Coverage to date":m.coverage[w],Status:STATUS_LABEL[m.status[w]]}))));
    add("Materials summary", f.materials.map(m => ({Material:m.part,Description:m.description,Unit:m.uom,"On hand":m.on_hand,Receipts:m.total_receipts,Required:m.total_required,Shortfall:m.shortfall,"First short week":m.first_short_week?L[m.first_short_week-1]:"","Used in":m.fgs.join(", ")}))); }
  if(mod === "cost"){ add("By finished good", r.cost.per_fg.map(f=>({"Finished good":f.fg,Demand:f.planned,"Unit material cost":f.unit_cost,"Scrap per unit":f.scrap_cost,"Selling price":f.selling_price,"Material margin":f.margin,"Plan cost":f.plan_cost,"Missing costs":f.missing_costs.join(", ")})));
    add("Cost lines", r.cost.per_fg.flatMap(f=>f.lines.map(l=>({"Finished good":f.fg,Material:l.part,"Qty per unit":l.qty_per_unit,"Unit cost":l.unit_cost,"Cost per unit":l.cost,"Scrap cost per unit":l.scrap_cost}))));
    add("Shortfall buy list", r.cost.shortfall_lines.map(l=>({Material:l.part,"First short week":l.first_short_week?L[l.first_short_week-1]:"",Shortfall:l.shortfall,"Unit cost":l.unit_cost,"Cost to cover":l.cost}))); }
  if(mod === "bom"){ const g = bomGraph(); add("BOM lines", g.edges.map(e=>({Parent:e.source,Child:e.target,"Qty per":e.qty_per,Unit:e.uom,Scrap:e.scrap,"Effective ratio":e.ratio})));
    add("Parts", g.nodes.map(n=>({Part:n.id,Description:n.description,Type:n.kind,Level:n.level,"Required for plan":n.required}))); }
  add("About", meta);
  XLSX.writeFile(wb, `${fileName().replace(".bomproject.json","")}-${mod}.xlsx`);
}

};
document.addEventListener("click", e => {
  if(S.ui.colmenu && !e.target.closest(".colmenu")){ S.ui.colmenu = null; render(); return; }
  const el = e.target.closest("[data-action]"); if(!el || !actions[el.dataset.action]) return;
  try{ actions[el.dataset.action](el, e); }catch(err){ console.error(err); toast(err.message); }
});
const changes = {
  rename: el => mutate(st => st.name = el.value.trim() || "Untitled project", {silent:true}),
  "tab-kind": el => mutate(st => st.mappings[el.dataset.tab] = call("map_columns", st.tabs.find(t=>t.id===el.dataset.tab), el.value)),
  "map-col": el => mutate(st => { const m = st.mappings[el.dataset.tab]; if(el.value) m.columns[el.dataset.field] = el.value; else delete m.columns[el.dataset.field]; }),
  "map-root": el => mutate(st => { st.mappings[el.dataset.tab].root = el.value.trim(); st.mappings[el.dataset.tab].root_guessed = false; }),
  "alias-target": el => { if(!el.value) return; const i = S.result.issues.find(x=>x.id===el.dataset.issue); mutate(st => i.parts.filter(p=>p!==el.value).forEach(p => st.fixes.aliases[p] = el.value)); },
  "demand-cell": el => setWeekCell("demand", el),
  "receipt-cell": el => setWeekCell("receipts", el),
  "weekly-fg": el => { S.ui.weeklyFg = el.value; render(); },
  "balance-mat": el => { S.ui.balanceMat = el.value; render(); },
  "col-toggle": el => { const t = el.dataset.table; S.state.settings.columns[t] ||= {}; S.state.settings.columns[t][el.dataset.col] = el.checked; scheduleAutosave(); render(); },
  "cost-fg": el => { S.ui.costFg = el.value; render(); },
  "explorer-fg": el => { S.ui.explorerFg = el.value; S.graph = null; render(); },
  decimals: el => { closeLayer(); mutate(st => st.settings.decimals = +el.value); },
};
document.addEventListener("change", e => { const el = e.target.closest("[data-change]"); if(!el || !changes[el.dataset.change]) return;
  try{ changes[el.dataset.change](el, e); }catch(err){ console.error(err); toast(err.message); } });
document.addEventListener("keydown", e => { if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); saveProject(false); } if(e.key==="Escape") closeLayer(); });
$("#file-input").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
$("#project-input").addEventListener("change", async e => { const f = e.target.files[0]; if(f) await loadProjectText(await f.text()); e.target.value = ""; });
boot();
</script>
</body>
</html>
