<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}

.projname:hover,.projname:focus{border-color:var(--line);outline:none;background:#fff}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--grey-soft);color:var(--ink2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.pill.ok .dot{background:var(--green)} .pill.warn .dot{background:var(--amber)} .pill.bad .dot{background:var(--red)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#C8D1DD;background:#FAFBFC}

<script type="text/python" id="engine-src">"""
BOM Gap Analyzer: calculation engine.

Deterministic by design: no randomness, no AI model, no hidden defaults.
Every number can be traced back to the BOM lines that produced it.

The engine is stateless. The interface sends the whole project state (raw
tabs, column mappings, analyst fixes, typed values) as JSON and gets JSON back.
The same functions run in Pyodide (in the browser) and in normal Python
(for tests).

Main entry points (all take and return plain dicts):
    propose_mapping(tab)          guess what a tab is and which column is which
    analyze(state)                issues, readiness, 4-week feasibility, cost
    trace(state, material)        arithmetic behind one requirement
    where_used(state, part)       every finished good a part feeds
    graph_data(state, fg)         nodes, edges, tree and money flow for the graphs
"""

import json
import math
import re
from collections import Counter, defaultdict

import networkx as nx

ENGINE_VERSION = "2.0.0"
HORIZON = 4          # planning horizon in weeks

# ---------------------------------------------------------------------------
# 1. Column mapping
# ---------------------------------------------------------------------------

# Header synonyms per field. Headers are compared after normalize_header().
SYNONYMS = {
    "parent": ["parent", "parent id", "parent part", "parent material", "assembly",
               "assembly id", "parent item", "header material", "finished good", "fg"],
    "child": ["child", "child id", "child part", "child item", "component",
              "component id", "component material", "component number", "material component"],
    "part_id": ["part", "part id", "part number", "part no", "material", "material number",
                "material no", "item", "item number", "sku", "component", "child part"],
    "qty_per": ["qty", "qty per", "quantity", "quantity per", "qty per parent", "usage",
                "comp qty", "component quantity", "qty per assembly", "qty bun"],
    "child_uom": ["uom", "unit", "un", "unit of measure", "child uom", "comp uom", "units"],
    "uom": ["uom", "unit", "un", "unit of measure", "units", "stock uom"],
    "scrap_factor": ["scrap factor", "scrap multiplier", "scrap mult"],
    "scrap_pct": ["scrap", "scrap %", "scrap pct", "scrap percent", "component scrap",
                  "comp scrap", "scrap rate"],
    "yield_pct": ["yield", "yield %", "yield pct", "yield percent"],
    "uom_conversion": ["conversion", "uom conversion", "conv factor", "conversion factor",
                       "conv", "unit conversion"],
    "level": ["level", "lvl", "explosion level", "bom level"],
    "available_qty": ["available", "available qty", "avail qty", "qty available",
                      "unrestricted", "unrestricted stock", "on hand", "stock", "available stock"],
    "unit_cost": ["unit cost", "cost", "std cost", "standard cost", "material cost",
                  "cost per unit", "moving avg price"],
    "selling_price": ["selling price", "sale price", "sales price", "price", "list price", "asp"],
    "description": ["description", "desc", "material description", "part description",
                    "item description", "name"],
    "part_type": ["type", "part type", "material type", "item type"],
    "base_uom": ["base uom", "base unit", "base unit of measure"],
    "week": ["week", "wk", "week no", "week number", "period", "bucket", "due week", "plan week",
             "date", "due date", "delivery date", "week of", "week start"],
    "demand_qty": ["demand", "demand qty", "forecast", "forecast qty", "order qty", "orders",
                   "requirement", "required qty", "qty", "quantity", "units"],
    "receipt_qty": ["receipt", "receipts", "receipt qty", "po qty", "open po qty", "open po",
                    "scheduled receipt", "scheduled qty", "incoming", "inbound qty", "due qty",
                    "qty", "quantity"],
}

# A header that names a week bucket: W1, Wk 2, Week 3, or a date.
WEEK_HEADER = re.compile(r"^\s*(w|wk|week)\s*[-#.]?\s*(\d{1,2})\s*$", re.I)
ISO_DATE = re.compile(r"^\s*(\d{4})-(\d{2})-(\d{2})")

# Which fields each tab kind uses (first entries are required).
KIND_FIELDS = {
    "bom": {"required": ["parent", "child", "qty_per"],
            "optional": ["child_uom", "scrap_factor", "scrap_pct", "yield_pct", "uom_conversion"]},
    "indented": {"required": ["level", "part_id", "qty_per"],
                 "optional": ["child_uom", "scrap_factor", "scrap_pct", "yield_pct", "uom_conversion"]},
    "inventory": {"required": ["part_id", "available_qty"], "optional": ["uom"]},
    "prices": {"required": ["part_id"], "optional": ["unit_cost", "selling_price"]},
    "parts": {"required": ["part_id"], "optional": ["description", "part_type", "base_uom"]},
    # Weekly tabs: either long (part, week, qty) or wide (part plus one column per week).
    "demand": {"required": ["part_id"], "optional": ["week", "demand_qty"]},
    "receipts": {"required": ["part_id"], "optional": ["week", "receipt_qty"]},
    "ignore": {"required": [], "optional": []},
}


def normalize_header(h):
    h = "" if h is None else str(h)
    h = h.strip().lower().replace("_", " ").replace("/", " ").replace(".", " ")
    h = re.sub(r"[^a-z0-9% ]", " ", h)
    return re.sub(r"\s+", " ", h).strip()


def _match_header(headers, field, taken):
    """Return the header that best matches a field, or None."""
    syns = SYNONYMS.get(field, [])
    norm = {h: normalize_header(h) for h in headers if h not in taken}
    for s in syns:                                   # exact match first
        for h, n in norm.items():
            if n == s:
                return h
    for s in syns:                                   # then whole-word containment
        if len(s) < 3:
            continue
        for h, n in norm.items():
            if re.search(r"\b" + re.escape(s) + r"\b", n):
                return h
    return None


def _map_fields(headers, kind):
    taken, cols = set(), {}
    spec = KIND_FIELDS[kind]
    for f in spec["required"] + spec["optional"]:
        h = _match_header(headers, f, taken)
        if h is not None:
            cols[f] = h
            taken.add(h)
    return cols


def week_columns(headers):
    """Headers that are week buckets (W1, Week 2, a date or an Excel date serial)."""
    return [h for h in headers if _week_key(h) is not None]


def _week_key(v):
    """Return ('n', week number) or ('d', day number) for a week label, else None."""
    if v is None or isinstance(v, bool):
        return None
    if isinstance(v, (int, float)):
        if 20000 <= v <= 80000:                      # Excel date serial
            return ("d", int(v))
        if float(v).is_integer() and 1 <= v <= 52:
            return ("n", int(v))
        return None
    s = str(v).strip()
    m = WEEK_HEADER.match(s)
    if m:
        return ("n", int(m.group(2)))
    if re.fullmatch(r"\d{1,2}", s):
        return ("n", int(s))
    m = ISO_DATE.match(s)
    if m:
        import datetime
        d = datetime.date(int(m.group(1)), int(m.group(2)), int(m.group(3)))
        return ("d", (d - datetime.date(1899, 12, 30)).days)
    return None


def _weekly_kind(tab, headers):
    """Is this a demand or a receipts tab? Decided by header and sheet-name keywords."""
    text = " ".join(normalize_header(h) for h in headers) + " " + normalize_header(tab.get("sheet"))
    is_rec = re.search(r"\b(po|pos|purchase order|receipt|receipts|inbound|incoming|supply)\b", text)
    is_dem = re.search(r"\b(demand|forecast|orders|order book|requirement|requirements|mps)\b", text)
    if not (is_rec or is_dem):
        return None
    has_part = _match_header(headers, "part_id", set()) is not None
    weeks = week_columns(headers)
    has_week = _match_header(headers, "week", set()) is not None
    if not has_part or not (weeks or has_week):
        return None
    return "receipts" if is_rec and not is_dem else "demand"


def propose_mapping(tab):
    """Guess the tab kind and its column mapping. The analyst confirms it."""
    headers = [h for h in tab.get("headers", []) if h not in (None, "")]
    wk = _weekly_kind(tab, headers)
    if wk:
        return map_columns(tab, wk)
    candidates = {}
    for kind in ("indented", "bom", "inventory", "prices", "parts"):
        cols = _map_fields(headers, kind)
        req = KIND_FIELDS[kind]["required"]
        if all(f in cols for f in req):
            candidates[kind] = cols
    # Priority: structural kinds first, then the rest.
    if "indented" in candidates and "parent" not in _map_fields(headers, "bom"):
        kind = "indented"
    elif "bom" in candidates:
        kind = "bom"
    elif "inventory" in candidates:
        kind = "inventory"
    elif "prices" in candidates and (
            "unit_cost" in candidates["prices"] or "selling_price" in candidates["prices"]):
        kind = "prices"
    elif "parts" in candidates and len(candidates["parts"]) > 1:
        kind = "parts"
    else:
        kind = "ignore"
    cols = candidates.get(kind, {})
    mapping = {"kind": kind, "columns": cols}
    if kind == "indented":
        mapping["root"] = _guess_root(tab)
        mapping["root_guessed"] = True      # shown as unconfirmed until the analyst edits it
    return mapping


def map_columns(tab, kind):
    """Re-guess columns when the analyst changes a tab's kind."""
    headers = [h for h in tab.get("headers", []) if h not in (None, "")]
    if kind in ("demand", "receipts"):
        wcols = week_columns(headers)
        taken = set(wcols)
        cols = {}
        pid = _match_header(headers, "part_id", taken)
        if pid:
            cols["part_id"] = pid
            taken.add(pid)
        if not wcols:                                 # long format: one row per part and week
            qf = "demand_qty" if kind == "demand" else "receipt_qty"
            for f in ("week", qf):
                h = _match_header(headers, f, taken)
                if h:
                    cols[f] = h
                    taken.add(h)
        return {"kind": kind, "columns": cols, "week_columns": wcols}
    out = {"kind": kind, "columns": _map_fields(headers, kind) if kind in KIND_FIELDS else {}}
    if kind == "indented":
        out["root"] = _guess_root(tab)
    return out


def schema():
    return {"kinds": KIND_FIELDS, "version": ENGINE_VERSION, "horizon": HORIZON}


def _guess_root(tab):
    """For an indented BOM with no level-0 row, guess the top part from the sheet name."""
    name = str(tab.get("sheet") or "").strip()
    m = re.search(r"\b[A-Za-z]{1,6}-?\d{2,}\b", name)
    return normalize_id(m.group(0)) if m else ""


# ---------------------------------------------------------------------------
# 2. Value parsing
# ---------------------------------------------------------------------------

def normalize_id(v):
    """Trim, upper-case and collapse spaces. 100.0 from Excel becomes '100'."""
    if v is None:
        return ""
    if isinstance(v, float) and v.is_integer():
        v = int(v)
    s = str(v).strip().upper()
    return re.sub(r"\s+", " ", s)


def parse_num(v):
    """Parse '1,250', '5%', ' 2 ' and numbers. Blank or text returns None."""
    if v is None or isinstance(v, bool):
        return None
    if isinstance(v, (int, float)):
        return float(v)
    s = str(v).strip().replace(",", "")
    if s.endswith("%"):
        s = s[:-1].strip()
    if s == "":
        return None
    try:
        return float(s)
    except ValueError:
        return None


def parse_level(v):
    """SAP-style levels: 1, '2', '.2', '..3', '*3*' all give the integer level."""
    if v is None:
        return None
    if isinstance(v, (int, float)):
        return int(v)
    s = str(v).strip()
    m = re.search(r"\d+", s)
    if m:
        return int(m.group(0))
    dots = s.count(".")
    return dots if dots else None


def _has_pct(v):
    return isinstance(v, str) and v.strip().endswith("%")


def _as_fraction(raw, warnings, key, what):
    """Turn a scrap or yield cell into a fraction.

    '5%' and 5 both mean 5%. A bare value below 1 (0.05) is read as a fraction
    and flagged, because it is ambiguous. '0.5%' keeps its percent sign: 0.005.
    """
    v = parse_num(raw)
    if v is None or v <= 0:
        return None
    if _has_pct(raw) or v >= 1:
        return v / 100.0
    warnings.append((key, "%s %s read as %.4g%%; enter it with a %% sign if that is wrong"
                     % (what, raw, v * 100)))
    return v


def _scrap_from_row(row, cols, warnings, key):
    """Return the scrap multiplier for a line. One convention: multiplier >= 1."""
    if "scrap_factor" in cols:
        raw = row.get(cols["scrap_factor"])
        v = parse_num(raw)
        if v is not None and v > 0:
            if _has_pct(raw):
                return 1 + v / 100.0
            if v < 1:
                warnings.append((key, "Scrap factor %s read as %.4g%% extra (factor %.4g)"
                                 % (raw, v * 100, 1 + v)))
                return 1 + v
            return v
    if "scrap_pct" in cols:
        f = _as_fraction(row.get(cols["scrap_pct"]), warnings, key, "Scrap")
        if f is not None:
            return 1 + f
    if "yield_pct" in cols:
        f = _as_fraction(row.get(cols["yield_pct"]), warnings, key, "Yield")
        if f is not None and 0 < f <= 1:
            return 1.0 / f
    return 1.0


TOL = 1e-9


def is_short(required, available):
    """Shortfall test with a relative tolerance so float noise never flips the answer."""
    return required - available > TOL * max(1.0, abs(required))


def shortfall_qty(required, available):
    return required - available if is_short(required, available) else 0.0


# ---------------------------------------------------------------------------
# 3. Ingestion: raw tabs to normalized tables
# ---------------------------------------------------------------------------

def _rows_as_dicts(tab):
    headers = tab.get("headers", [])
    out = []
    for r in tab.get("rows", []):
        d = {}
        for i, h in enumerate(headers):
            if h in (None, ""):
                continue
            d[h] = r[i] if i < len(r) else None
        out.append(d)
    return out


def ingest(state):
    """Turn raw tabs plus mappings plus fixes into normalized tables."""
    fixes = state.get("fixes") or {}
    aliases = {normalize_id(k): normalize_id(v) for k, v in (fixes.get("aliases") or {}).items()}
    conv_fix = fixes.get("conversions") or {}
    qty_fix = fixes.get("qty") or {}
    excluded = set(fixes.get("excluded") or [])

    alias_loops = set()

    def pid(v):
        p = normalize_id(v)
        seen = [p]
        while p in aliases:                          # follow alias chains A > B > C
            p = aliases[p]
            if p in seen:                            # A > B > A: report, keep the original ID
                alias_loops.add(" > ".join(seen + [p]))
                return seen[0]
            seen.append(p)
        return p

    lines, inventory, prices, parts = [], {}, {}, {}
    raw_ids = Counter()          # IDs as written (normalized only), for near-match checks
    notes = []                   # (line_key, message) informational warnings
    inv_uom = {}

    for tab in state.get("tabs", []):
        m = (state.get("mappings") or {}).get(tab["id"]) or {}
        kind, cols = m.get("kind", "ignore"), m.get("columns", {})
        rows = _rows_as_dicts(tab)
        label = "%s / %s" % (tab.get("file", ""), tab.get("sheet", ""))

        if kind == "bom":
            for i, row in enumerate(rows):
                key = "%s:%d" % (tab["id"], i)
                praw, craw = row.get(cols.get("parent")), row.get(cols.get("child"))
                if normalize_id(praw) == "" and normalize_id(craw) == "":
                    continue
                raw_ids[normalize_id(praw)] += 1
                raw_ids[normalize_id(craw)] += 1
                lines.append(_make_line(key, label, i, pid(praw), pid(craw), row, cols,
                                        qty_fix, conv_fix, excluded, notes))

        elif kind == "indented":
            root = pid(m.get("root", ""))
            stack = {}
            if root:
                stack[0] = root
                raw_ids[root] += 1
            for i, row in enumerate(rows):
                key = "%s:%d" % (tab["id"], i)
                lvl = parse_level(row.get(cols.get("level")))
                part_raw = row.get(cols.get("part_id"))
                part = pid(part_raw)
                if lvl is None or part == "":
                    continue
                raw_ids[normalize_id(part_raw)] += 1
                stack[lvl] = part
                for deeper in [k for k in stack if k > lvl]:
                    del stack[deeper]
                parent = stack.get(lvl - 1)
                if parent is None:
                    if lvl == 0 or not root:
                        continue                     # a level-0 header row or no root known
                    notes.append((key, "Row skipped: no parent at level %d" % (lvl - 1)))
                    continue
                lines.append(_make_line(key, label, i, parent, part, row, cols,
                                        qty_fix, conv_fix, excluded, notes))

        elif kind == "inventory":
            for i, row in enumerate(rows):
                p = pid(row.get(cols.get("part_id")))
                q = parse_num(row.get(cols.get("available_qty")))
                if p and q is not None:
                    inventory[p] = inventory.get(p, 0.0) + q
                    if "uom" in cols and row.get(cols["uom"]) not in (None, ""):
                        inv_uom[p] = str(row.get(cols["uom"])).strip().upper()

        elif kind == "prices":
            for row in rows:
                p = pid(row.get(cols.get("part_id")))
                if not p:
                    continue
                c = parse_num(row.get(cols.get("unit_cost"))) if "unit_cost" in cols else None
                s = parse_num(row.get(cols.get("selling_price"))) if "selling_price" in cols else None
                rec = prices.setdefault(p, {})
                if c is not None:
                    rec["unit_cost"] = c
                if s is not None:
                    rec["selling_price"] = s

        elif kind == "parts":
            for row in rows:
                p = pid(row.get(cols.get("part_id")))
                if not p:
                    continue
                rec = parts.setdefault(p, {})
                for f in ("description", "part_type", "base_uom"):
                    if f in cols and row.get(cols[f]) not in (None, ""):
                        rec[f] = str(row.get(cols[f])).strip()

    # Analyst overrides typed into the tool win over file values.
    ov = state.get("overrides") or {}
    for p, v in (ov.get("unit_cost") or {}).items():
        if parse_num(v) is not None:
            prices.setdefault(pid(p), {})["unit_cost"] = parse_num(v)
    for p, v in (ov.get("selling_price") or {}).items():
        if parse_num(v) is not None:
            prices.setdefault(pid(p), {})["selling_price"] = parse_num(v)
    for p, v in (ov.get("available") or {}).items():
        if parse_num(v) is not None:
            inventory[pid(p)] = parse_num(v)

    return {"lines": lines, "inventory": inventory, "prices": prices, "parts": parts,
            "raw_ids": raw_ids, "notes": notes, "inv_uom": inv_uom,
            "alias_loops": sorted(alias_loops), "dup_choice": fixes.get("duplicates") or {}}


def _make_line(key, label, row_index, parent, child, row, cols, qty_fix, conv_fix, excluded, notes):
    qty = parse_num(qty_fix[key]) if key in qty_fix else parse_num(row.get(cols.get("qty_per")))
    uom = row.get(cols["child_uom"]) if "child_uom" in cols else None
    uom = str(uom).strip().upper() if uom not in (None, "") else ""
    if key in conv_fix:
        conv = parse_num(conv_fix[key])
    elif "uom_conversion" in cols:
        conv = parse_num(row.get(cols["uom_conversion"]))
    else:
        conv = None
    scrap = _scrap_from_row(row, cols, notes, key)
    return {"key": key, "source": label, "row": row_index + 2,  # +2: header row, 1-based
            "parent": parent, "child": child, "qty_per": qty, "uom": uom,
            "conversion": conv, "scrap": scrap, "excluded": key in excluded}


# ---------------------------------------------------------------------------
# 4. Validation and model building
# ---------------------------------------------------------------------------

def _id_key(p):
    return re.sub(r"[^A-Z0-9]", "", p)


def build_model(state):
    """Normalize, validate and build the BOM graph. Returns a model dict."""
    data = ingest(state)
    lines = data["lines"]
    issues = []

    def issue(severity, code, message, **kw):
        issues.append(dict(severity=severity, code=code, message=message, **kw))

    # Near-matching IDs (SR-100 vs SR100 vs sr100). Suggest; never merge silently.
    groups = defaultdict(set)
    all_ids = set(data["raw_ids"]) | set(data["inventory"]) | set(data["prices"])
    used_ids = set()
    for ln in lines:
        used_ids.add(ln["parent"])
        used_ids.add(ln["child"])
    for p in (used_ids | set(data["inventory"]) | set(data["prices"])):
        if p:
            groups[_id_key(p)].add(p)
    for k, ids in sorted(groups.items()):
        if len(ids) > 1:
            ranked = sorted(ids, key=lambda x: (-data["raw_ids"].get(x, 0), -("-" in x), x))
            canon = ranked[0]
            issue("warning", "near_match",
                  "These IDs look like the same part: %s" % ", ".join(sorted(ids)),
                  parts=sorted(ids), fix={"type": "alias", "to": canon,
                                          "from": [x for x in ranked[1:]]})

    # Line-level checks.
    seen_pairs = {}
    good = []
    dup_block = set()                                # parents with an unresolved conflicting duplicate
    for ln in lines:
        where = "%s row %d" % (ln["source"], ln["row"])
        if ln["excluded"]:
            continue
        if ln["parent"] == ln["child"]:
            issue("error", "self_reference", "%s: %s lists itself as a component" % (where, ln["parent"]),
                  line=ln["key"], parts=[ln["parent"]], fix={"type": "exclude", "line": ln["key"]})
            ln["excluded"] = True
            ln["blocked"] = True
            continue
        if ln["qty_per"] is None or ln["qty_per"] <= 0:
            issue("error", "missing_qty", "%s: quantity missing for %s in %s" % (where, ln["child"], ln["parent"]),
                  line=ln["key"], parts=[ln["parent"], ln["child"]],
                  fix={"type": "qty", "line": ln["key"]})
            ln["blocked"] = True
            continue
        pair = (ln["parent"], ln["child"])
        if pair in seen_pairs:
            first = seen_pairs[pair]
            choice = data["dup_choice"].get(ln["key"])
            if choice == "sum":                      # split item positions: add them up
                first["qty_per"] += ln["qty_per"]
                continue
            if choice == "first":
                continue
            same = (abs(first["qty_per"] - ln["qty_per"]) <= TOL * max(1.0, first["qty_per"])
                    and first["uom"] == ln["uom"] and first["scrap"] == ln["scrap"])
            if same:
                issue("warning", "duplicate_line",
                      "%s: %s in %s repeats %s row %d with the same quantity; the first line is used"
                      % (where, ln["child"], ln["parent"], first["source"], first["row"]),
                      line=ln["key"], parts=list(pair), fix={"type": "exclude", "line": ln["key"]})
            else:
                issue("error", "conflicting_duplicate",
                      "%s: %s in %s appears again with quantity %s (first: %s at %s row %d). "
                      "Choose whether to add them up or keep only the first"
                      % (where, ln["child"], ln["parent"], _num(ln["qty_per"]), _num(first["qty_per"]),
                         first["source"], first["row"]),
                      line=ln["key"], parts=list(pair), fix={"type": "duplicate", "line": ln["key"]})
                dup_block.add(ln["parent"])
            continue
        seen_pairs[pair] = ln
        good.append(ln)


    # Base unit per part: parts table, then inventory unit, then most common usage unit.
    usage_uoms = defaultdict(Counter)
    for ln in good:
        if ln["uom"]:
            usage_uoms[ln["child"]][ln["uom"]] += 1
    base_uom = {}
    for p in set(usage_uoms) | set(data["parts"]) | set(data["inv_uom"]):
        if data["parts"].get(p, {}).get("base_uom"):
            base_uom[p] = data["parts"][p]["base_uom"].upper()
        elif p in data["inv_uom"]:
            base_uom[p] = data["inv_uom"][p]
        elif usage_uoms[p]:
            base_uom[p] = sorted(usage_uoms[p].items(), key=lambda kv: (-kv[1], kv[0]))[0][0]

    final = []
    for ln in good:
        b = base_uom.get(ln["child"], "")
        needs_conv = ln["uom"] and b and ln["uom"] != b
        bad_conv = ln["conversion"] is not None and ln["conversion"] <= 0
        if (needs_conv and ln["conversion"] is None) or bad_conv:
            issue("error", "missing_conversion",
                  ("%s row %d: unit conversion %s is not a positive number for %s"
                   % (ln["source"], ln["row"], _num(ln["conversion"]), ln["child"])) if bad_conv else
                  ("%s row %d: %s is used in %s but stocked in %s; enter how many %s per %s"
                   % (ln["source"], ln["row"], ln["child"], ln["uom"], b, b, ln["uom"])),
                  line=ln["key"], parts=[ln["parent"], ln["child"]],
                  fix={"type": "conversion", "line": ln["key"], "from_uom": ln["uom"], "to_uom": b})
            ln["blocked"] = True
            continue
        conv = ln["conversion"] if ln["conversion"] is not None else 1.0
        ln["conv_used"] = conv
        ln["ratio"] = ln["qty_per"] * conv * ln["scrap"]
        final.append(ln)

    for key, msg in data["notes"]:
        issue("info", "note", msg, line=key)

    # Inventory unit check. Stock in a different unit than the BOM can't be compared,
    # so it is treated as unknown until the analyst enters it in the right unit.
    typed_stock = {normalize_id(k) for k in ((state.get("overrides") or {}).get("available") or {})}
    for p, u in sorted(data["inv_uom"].items()):
        if p in usage_uoms and base_uom.get(p) and u != base_uom[p] and p not in typed_stock:
            issue("error", "inventory_uom", "Stock for %s is counted in %s but the BOM uses %s; "
                  "enter the available quantity in %s" % (p, u, base_uom[p], base_uom[p]), parts=[p],
                  fix={"type": "stock", "part": p})
            data["inventory"].pop(p, None)

    for loop in data["alias_loops"]:
        issue("error", "alias_loop", "Your ID merges point back to themselves (%s); undo one of them" % loop)

    g = nx.DiGraph()
    for ln in final:
        g.add_edge(ln["parent"], ln["child"], **{k: ln[k] for k in
                   ("key", "source", "row", "qty_per", "uom", "conv_used", "scrap", "ratio")})
    blocked_nodes = set(dup_block)
    for ln in lines:
        if ln.get("blocked") and not ln["excluded"]:
            blocked_nodes.add(ln["parent"])
            g.add_node(ln["parent"])
            g.add_node(ln["child"])

    cycles = []
    if not nx.is_directed_acyclic_graph(g):
        for cyc in nx.simple_cycles(g):
            cycles.append(cyc)
            if len(cycles) >= 5:
                break
        types = {p: str(v.get("part_type", "")).upper() for p, v in data["parts"].items()}
        for cyc in cycles:
            options = []
            for a, b in zip(cyc, cyc[1:] + cyc[:1]):
                e = g.edges[a, b]
                options.append({"line": e["key"], "parent": a, "child": b,
                                "source": e["source"], "row": e["row"]})
            # Suggest the line most likely to be the mistake: a raw material used as a
            # parent, else the parent with the fewest components. The analyst decides.
            sug = min(options, key=lambda o: (types.get(o["parent"], "") not in ("RAW", "RM", "ROH"),
                                              g.out_degree(o["parent"]), o["parent"]))
            issue("error", "cycle", "Loop: %s contains itself (%s). Suggested fix: remove %s > %s (%s row %d)"
                  % (cyc[0], " > ".join(cyc + [cyc[0]]), sug["parent"], sug["child"],
                     sug["source"], sug["row"]),
                  parts=list(cyc), line=sug["line"],
                  fix={"type": "exclude", "line": sug["line"], "options": options})

    # Orphans: stock or prices for parts that no BOM uses.
    bom_parts = set(g.nodes)
    for p in sorted(set(data["inventory"]) - bom_parts):
        issue("info", "orphan_stock", "Stock listed for %s, which no BOM uses" % p, parts=[p])

    # A finished good whose only lines are blocked still counts, so it shows as blocked.
    roots = sorted(n for n in g.nodes if g.in_degree(n) == 0 and (g.out_degree(n) > 0 or n in blocked_nodes))
    leaves = sorted(n for n in g.nodes if g.out_degree(n) == 0 and g.in_degree(n) > 0)

    mids = sorted(p for p in data["inventory"] if p in g and g.out_degree(p) > 0)
    if mids:
        issue("info", "assembly_stock", "Stock for assemblies is not netted in version 1, so requirements "
              "assume these are built from raw materials: %s" % ", ".join(mids[:10]) +
              (" and %d more" % (len(mids) - 10) if len(mids) > 10 else ""), parts=mids)

    # Precomputed reachability, reused by every module (avoids repeated graph walks).
    desc = {}
    fg_leaves, leaf_fgs = {}, defaultdict(list)
    if not cycles:
        for fg in roots:
            desc[fg] = nx.descendants(g, fg)
            fg_leaves[fg] = sorted(n for n in desc[fg] if g.out_degree(n) == 0)
            for m in fg_leaves[fg]:
                leaf_fgs[m].append(fg)

    fg_blocked = {}
    if not cycles:
        for fg in roots:
            bad = sorted((desc[fg] | {fg}) & blocked_nodes)
            if bad:
                fg_blocked[fg] = bad

    sev_order = {"error": 0, "warning": 1, "info": 2}
    issues.sort(key=lambda x: (sev_order[x["severity"]], x["code"], x["message"]))
    for i, it in enumerate(issues):
        it["id"] = "%s-%d" % (it["code"], i)

    return {"graph": g, "issues": issues, "roots": roots, "leaves": leaves,
            "cycles": cycles, "fg_blocked": fg_blocked, "inventory": data["inventory"],
            "desc": desc, "fg_leaves": fg_leaves, "leaf_fgs": {k: sorted(v) for k, v in leaf_fgs.items()},
            "pu_cache": {},
            "prices": data["prices"], "parts": data["parts"], "base_uom": base_uom,
            "line_count": len(lines)}


_MODEL_CACHE = {}


def get_model(state):
    """Build the model once per distinct data input (results never stored)."""
    ov = state.get("overrides") or {}
    ov = {k: ov.get(k) for k in ("available", "unit_cost", "selling_price")}   # weekly edits don't rebuild the model
    key = json.dumps([state.get("tabs"), state.get("mappings"), state.get("fixes"), ov],
                     sort_keys=True, default=str)
    if key not in _MODEL_CACHE:
        _MODEL_CACHE.clear()
        _MODEL_CACHE[key] = build_model(state)
    return _MODEL_CACHE[key]


# ---------------------------------------------------------------------------
# 5. Explosion
# ---------------------------------------------------------------------------

def per_unit(model, fg, use_scrap=True):
    """Gross requirement of every node to build ONE unit of fg (sums all paths).

    Walks the finished good's sub-graph once in topological order, so shared
    assemblies are counted once per path without enumerating paths. Cached on
    the model because every module needs it.
    """
    key = (fg, use_scrap)
    cache = model["pu_cache"]
    if key in cache:
        return cache[key]
    g = model["graph"]
    req = defaultdict(float)
    req[fg] = 1.0
    nodes = model["desc"].get(fg, set()) | {fg}
    for node in nx.topological_sort(g.subgraph(nodes)):
        q = req.get(node, 0.0)
        if q == 0:
            continue
        for child in g.successors(node):
            e = g.edges[node, child]
            r = e["ratio"] if use_scrap else e["qty_per"] * e["conv_used"]
            req[child] += q * r
    cache[key] = dict(req)
    return cache[key]


def explode(model, plan, use_scrap=True):
    """Total requirement per node for a plan {fg: qty}."""
    total = defaultdict(float)
    for fg, q in sorted(plan.items()):
        if q and fg in model["graph"]:
            for n, v in per_unit(model, fg, use_scrap).items():
                total[n] += q * v
    return dict(total)


def _fg_leaves(model, fg):
    return model["fg_leaves"].get(fg, [])


def _num(v):
    return "%g" % v if isinstance(v, (int, float)) else str(v)


# ---------------------------------------------------------------------------
# 6. Weekly inputs: demand signal and scheduled receipts
# ---------------------------------------------------------------------------

def _alias_resolver(state):
    aliases = {normalize_id(k): normalize_id(v)
               for k, v in (((state.get("fixes") or {}).get("aliases")) or {}).items()}

    def pid(v):
        p = normalize_id(v)
        seen = [p]
        while p in aliases:
            p = aliases[p]
            if p in seen:
                return seen[0]
            seen.append(p)
        return p
    return pid


def _day_label(day):
    import datetime
    d = datetime.date(1899, 12, 30) + datetime.timedelta(days=day)
    return "Wk of %s %d" % (d.strftime("%b"), d.day)


def time_inputs(state, model):
    """Demand per finished good and receipts per raw material, as HORIZON weekly buckets.

    Accepts long tabs (part, week, qty) and wide tabs (part plus one column per
    week). Weeks can be numbers (1, W2, Week 3) or dates; dates are grouped into
    weeks starting on the Monday of the earliest date. Values typed in the tool
    (overrides) replace file values cell by cell.
    """
    pid = _alias_resolver(state)
    raw, notes = [], []
    has = {"demand": False, "receipts": False}
    for tab in state.get("tabs", []):
        m = (state.get("mappings") or {}).get(tab["id"]) or {}
        kind = m.get("kind")
        if kind not in ("demand", "receipts"):
            continue
        has[kind] = True
        cols, wcols = m.get("columns", {}), m.get("week_columns") or []
        qf = "demand_qty" if kind == "demand" else "receipt_qty"
        if "part_id" not in cols:
            continue
        for i, row in enumerate(_rows_as_dicts(tab)):
            p = pid(row.get(cols["part_id"]))
            if not p:
                continue
            if wcols:
                for h in wcols:
                    q = parse_num(row.get(h))
                    if q:
                        raw.append((kind, p, _week_key(h), q))
            elif "week" in cols and qf in cols:
                q = parse_num(row.get(cols[qf]))
                key = _week_key(row.get(cols["week"]))
                if q and key is None:
                    notes.append("%s row %d: week %r not recognized, row skipped"
                                 % (tab.get("sheet"), i + 2, row.get(cols["week"])))
                elif q:
                    raw.append((kind, p, key, q))
    days = [k[1] for kind, _, k, _ in raw if k[0] == "d" and kind == "demand"] or \
           [k[1] for _, _, k, _ in raw if k[0] == "d"]
    start = None
    if days:
        mn = min(days)
        start = mn - ((mn - 2) % 7)                   # Excel serial day 2 is a Monday

    def index(k):
        return k[1] if k[0] == "n" else (k[1] - start) // 7 + 1

    roots, leaves = set(model["roots"]), set(model["leaves"])
    demand = {f: [0.0] * HORIZON for f in model["roots"]}
    receipts = {}
    late, past, stray = Counter(), Counter(), defaultdict(set)
    for kind, p, k, q in raw:
        w = index(k)
        if w < 1:
            past[kind] += 1
            w = 1
        if w > HORIZON:
            late[kind] += 1
            continue
        if kind == "demand":
            if p not in roots:
                stray["demand"].add(p)
                continue
            demand[p][w - 1] += q
        else:
            if p not in leaves:
                stray["receipts"].add(p)
                continue
            receipts.setdefault(p, [0.0] * HORIZON)[w - 1] += q
    ov = state.get("overrides") or {}
    for f, weeks in (ov.get("demand") or {}).items():
        f = pid(f)
        if f in demand:
            for w, q in weeks.items():
                if 1 <= int(w) <= HORIZON and parse_num(q) is not None:
                    demand[f][int(w) - 1] = max(0.0, parse_num(q))
    for mtl, weeks in (ov.get("receipts") or {}).items():
        mtl = pid(mtl)
        if mtl in leaves:
            row = receipts.setdefault(mtl, [0.0] * HORIZON)
            for w, q in weeks.items():
                if 1 <= int(w) <= HORIZON and parse_num(q) is not None:
                    row[int(w) - 1] = max(0.0, parse_num(q))
    receipts = {k: v for k, v in receipts.items() if any(v)}
    for kind, n in sorted(late.items()):
        notes.append("%d %s entries fall after week %d and are outside this plan" % (n, kind, HORIZON))
    for kind, n in sorted(past.items()):
        notes.append("%d past-due %s entries were moved into week 1" % (n, kind))
    if stray["demand"]:
        notes.append("Demand ignored for parts that aren't finished goods in the BOM: %s"
                     % ", ".join(sorted(stray["demand"])[:8]))
    if stray["receipts"]:
        notes.append("Receipts ignored for parts that aren't raw materials in the BOM: %s"
                     % ", ".join(sorted(stray["receipts"])[:8]))
    labels = [_day_label(start + 7 * i) for i in range(HORIZON)] if start is not None else \
             ["Week %d" % (i + 1) for i in range(HORIZON)]
    return {"demand": demand, "receipts": receipts, "labels": labels, "notes": notes,
            "has_demand_tab": has["demand"], "has_receipts_tab": has["receipts"]}


# ---------------------------------------------------------------------------
# 7. Optimization (best buildable mix in one week)
# ---------------------------------------------------------------------------

def solve_mix(model, avail, fgs, upper=None, prices=None):
    """Best integer mix subject to stock. Exact solver (SciPy MILP / HiGHS).

    Objective: revenue when every finished good involved has a selling price
    above 0, otherwise total units. Never a mix of the two.
    Returns ({fg: units}, method, objective). Without SciPy it falls back to a
    greedy integer method and says so.
    """
    g = model["graph"]
    fgs = [f for f in fgs if f in g]
    mats = sorted({m for f in fgs for m in _fg_leaves(model, f)})
    A = []
    pu = {f: per_unit(model, f) for f in fgs}
    for m in mats:
        A.append([pu[f].get(m, 0.0) for f in fgs])
    b = [max(0.0, avail.get(m, 0.0)) for m in mats]
    pr = [(prices or {}).get(f) for f in fgs]
    objective = "revenue" if fgs and all(p is not None and p > 0 for p in pr) else "units"
    w = [float(p) for p in pr] if objective == "revenue" else [1.0] * len(fgs)
    ub = []
    for j, f in enumerate(fgs):
        cap = min((b[i] / A[i][j]) for i in range(len(mats)) if A[i][j] > 0) if any(
            A[i][j] > 0 for i in range(len(mats))) else 0.0
        if upper is not None:
            cap = min(cap, float(upper.get(f, 0.0)))
        ub.append(int(cap + 1e-9))
    try:
        import numpy as np
        from scipy.optimize import milp, LinearConstraint, Bounds
        if not fgs:
            return {}, "milp", objective
        b_tol = [v + TOL * max(1.0, v) for v in b]          # an exact fit counts as feasible
        res = milp(c=-np.array(w), constraints=[LinearConstraint(np.array(A), -np.inf, np.array(b_tol))] if mats else [],
                   integrality=np.ones(len(fgs)), bounds=Bounds(np.zeros(len(fgs)), np.array(ub, dtype=float)))
        if res.status == 0:
            x = [int(round(v)) for v in res.x]
            return {f: x[j] for j, f in enumerate(fgs)}, "milp", objective
    except ImportError:
        pass
    # Greedy fallback: highest weight per unit first, deterministic order.
    x = {f: 0 for f in fgs}
    left = list(b)
    for j in sorted(range(len(fgs)), key=lambda j: (-w[j], fgs[j])):
        cap = ub[j]
        for i in range(len(mats)):
            if A[i][j] > 0:
                cap = min(cap, int(left[i] / A[i][j] + 1e-9))
        x[fgs[j]] = max(0, cap)
        for i in range(len(mats)):
            left[i] -= A[i][j] * x[fgs[j]]
    return x, "greedy", objective


# ---------------------------------------------------------------------------
# 8. Feasibility over the horizon
# ---------------------------------------------------------------------------

UNLIMITED = 1e15


def _status(cov):
    if cov is None:
        return "unknown"
    if cov < 1 - TOL:
        return "red"
    if cov < 1.2 - TOL:
        return "amber"
    return "green"


def feasibility(model, ti):
    """Week-by-week plan against the demand signal.

    Each week: stock = carry-over + that week's receipts. The tool builds as much
    of the week's demand plus any backlog as stock allows (exact integer solver,
    highest selling value first when every product has a price, otherwise most
    units). Unmet demand carries forward as backlog. Production happens in the
    week it is needed (no lead-time offset).
    """
    g, prices = model["graph"], model["prices"]
    fgs = [f for f in model["roots"] if f not in model["fg_blocked"]]
    demand = {f: ti["demand"][f] for f in fgs}
    dem_fgs = [f for f in fgs if any(demand[f])]
    receipts = ti["receipts"]
    onhand = model["inventory"]
    sell = {f: prices.get(f, {}).get("selling_price") for f in fgs}
    pu = {f: per_unit(model, f) for f in dem_fgs}
    mats = sorted({m for f in dem_fgs for m in _fg_leaves(model, f)})
    unknown = [m for m in mats if m not in onhand]

    # Gross view: what each material needs if every week's demand is built on time.
    mat_rows = []
    for m in mats:
        req = [sum(demand[f][w] * pu[f].get(m, 0.0) for f in dem_fgs) for w in range(HORIZON)]
        rec = receipts.get(m, [0.0] * HORIZON)
        a = onhand.get(m)
        bal, pab, cov, st = (a or 0.0), [], [], []
        cum_req, cum_avail = 0.0, (a or 0.0)
        first_short = None
        for w in range(HORIZON):
            bal += rec[w] - req[w]
            cum_req += req[w]
            cum_avail += rec[w]
            pab.append(bal if a is not None else None)
            c = (cum_avail / cum_req if cum_req > 0 else None) if a is not None else None
            cov.append(c)
            s_ = "unknown" if a is None else ("green" if cum_req <= 0 else _status(c))
            st.append(s_)
            if a is not None and first_short is None and is_short(cum_req, cum_avail):
                first_short = w + 1
        total_req = sum(req)
        total_av = (a or 0.0) + sum(rec)
        worst = min((c for c in cov if c is not None), default=None)
        mat_rows.append({"part": m, "description": model["parts"].get(m, {}).get("description", ""),
                         "uom": model["base_uom"].get(m, ""), "on_hand": a, "receipts": rec,
                         "required": req, "balance": pab, "coverage": cov, "status": st,
                         "total_required": total_req, "total_receipts": sum(rec),
                         "total_available": total_av if a is not None else None,
                         "shortfall": shortfall_qty(total_req, total_av) if a is not None else None,
                         "first_short_week": first_short, "worst_coverage": worst,
                         "overall": "unknown" if a is None else ("red" if first_short else _status(worst) if worst is not None else "green"),
                         "fgs": model["leaf_fgs"].get(m, [])})
    mat_rows.sort(key=lambda r: (r["first_short_week"] or 99,
                                 r["worst_coverage"] if r["worst_coverage"] is not None else 1e18, r["part"]))

    # Week-by-week build with backlog.
    stock = {m: (onhand[m] if m in onhand else UNLIMITED) for m in mats}
    backlog = {f: 0.0 for f in dem_fgs}
    weeks, per_fg, method, objective = [], {f: [] for f in dem_fgs}, None, None
    for w in range(HORIZON):
        for m in mats:
            if m in onhand:
                stock[m] += receipts.get(m, [0.0] * HORIZON)[w]
        want = {f: demand[f][w] + backlog[f] for f in dem_fgs}
        if any(v > 0 for v in want.values()):
            x, method, objective = solve_mix(model, stock, [f for f in dem_fgs if want[f] > 0], want, sell)
        else:
            x = {}
        tot = {"week": w + 1, "label": ti["labels"][w], "demand": 0.0, "backlog_in": 0.0,
               "built": 0.0, "on_time": 0.0, "late_filled": 0.0, "short": 0.0}
        for f in dem_fgs:
            b = float(x.get(f, 0))
            for m in _fg_leaves(model, f):
                if m in onhand:
                    stock[m] -= b * pu[f].get(m, 0.0)
            late_filled = min(backlog[f], b)
            on_time = b - late_filled
            new_backlog = max(0.0, want[f] - b)
            per_fg[f].append({"demand": demand[f][w], "backlog_in": backlog[f], "built": b,
                              "on_time": on_time, "late_filled": late_filled, "short": new_backlog})
            for k, v in (("demand", demand[f][w]), ("backlog_in", backlog[f]), ("built", b),
                         ("on_time", on_time), ("late_filled", late_filled), ("short", new_backlog)):
                tot[k] += v
            backlog[f] = new_backlog
        weeks.append(tot)

    total_dem = sum(t["demand"] for t in weeks)
    total_on_time = sum(t["on_time"] for t in weeks)
    unmet_end = weeks[-1]["short"] if weeks else 0.0
    first_short_week = next((t["week"] for t in weeks if t["short"] > 0), None)
    shorts = [r for r in mat_rows if r["first_short_week"]]
    bottleneck = None
    if shorts:
        bottleneck = min(shorts, key=lambda r: (r["first_short_week"],
                         min(b for b in r["balance"] if b is not None) / max(r["total_required"], 1e-12),
                         r["part"]))["part"]
    known = [r for r in mat_rows if r["worst_coverage"] is not None]
    tightest = min(known, key=lambda r: (r["worst_coverage"], r["part"]))["part"] if known else None
    fg_rows = [{"fg": f, "description": model["parts"].get(f, {}).get("description", ""),
                "weeks": per_fg[f], "demand": sum(demand[f]),
                "built": sum(x["built"] for x in per_fg[f]), "on_time": sum(x["on_time"] for x in per_fg[f]),
                "unmet": per_fg[f][-1]["short"] if per_fg[f] else 0.0,
                "fill_rate": (sum(x["on_time"] for x in per_fg[f]) / sum(demand[f])) if sum(demand[f]) else None}
               for f in dem_fgs]

    if not dem_fgs:
        answer, feasible = "No demand entered yet.", None
    elif unknown:
        answer, feasible = "Incomplete: stock is missing for %d materials." % len(unknown), None
    elif first_short_week is None:
        answer, feasible = "Yes. All %d weeks of demand can be built on time." % HORIZON, True
    else:
        short_weeks = [t for t in weeks if t["short"] > 0]
        hit = sorted({f for f in dem_fgs for x in per_fg[f] if x["short"] > 0})
        n = lambda v: format(int(round(v)), ",")
        if len(short_weeks) == 1:
            t = short_weeks[0]
            lead = "No. Week %d ends %s units short (%s)" % (t["week"], n(t["short"]), ", ".join(hit))
        else:
            parts = ["week %d by %s" % (t["week"], n(t["short"])) for t in short_weeks]
            lead = "No. %d of %d weeks end short: %s units (%s)" % (
                len(short_weeks), HORIZON, ", ".join(parts[:-1]) + " and " + parts[-1], ", ".join(hit))
        last = short_weeks[-1]["week"]
        tail = ("%s units are still unmet after week %d" % (n(unmet_end), HORIZON)) if unmet_end > 0 \
            else "the backlog clears in week %d" % (last + 1)
        answer, feasible = "%s; %s." % (lead, tail), False
    return {"answer": answer, "feasible": feasible, "weeks": weeks, "labels": ti["labels"],
            "finished_goods": fg_rows, "materials": mat_rows, "bottleneck": bottleneck,
            "tightest": tightest, "first_short_week": first_short_week,
            "on_time_rate": (total_on_time / total_dem) if total_dem else None,
            "total_demand": total_dem, "total_built": sum(t["built"] for t in weeks),
            "unmet_end": unmet_end, "unknown_stock": unknown, "mix_method": method,
            "mix_objective": objective, "has_receipts": bool(receipts),
            "blocked_fgs": sorted(model["fg_blocked"])}


# ---------------------------------------------------------------------------
# 9. Cost
# ---------------------------------------------------------------------------

def cost(model, feas):
    """Material cost of the plan (total demand over the horizon), scrap, shortfall cost,
    and revenue at risk (demand still unmet after the last week)."""
    prices = model["prices"]
    plan = {r["fg"]: r["demand"] for r in feas["finished_goods"]}
    fgs = sorted(plan) or sorted(f for f in model["roots"] if f not in model["fg_blocked"])
    per_fg, missing_all = [], set()
    for fg in fgs:
        pu, pu0 = per_unit(model, fg), per_unit(model, fg, use_scrap=False)
        lines, total, total0, missing = [], 0.0, 0.0, []
        for m in _fg_leaves(model, fg):
            c = prices.get(m, {}).get("unit_cost")
            if c is None:
                missing.append(m)
                continue
            v, v0 = pu[m] * c, pu0[m] * c
            total += v
            total0 += v0
            lines.append({"part": m, "qty_per_unit": pu[m], "unit_cost": c,
                          "cost": v, "cost_no_scrap": v0, "scrap_cost": v - v0})
        lines.sort(key=lambda x: (-x["cost"], x["part"]))
        missing_all.update(missing)
        price = prices.get(fg, {}).get("selling_price")
        q = plan.get(fg, 0)
        per_fg.append({"fg": fg, "unit_cost": total, "material_cost_no_scrap": total0,
                       "scrap_cost": total - total0, "missing_costs": missing, "complete": not missing,
                       "selling_price": price,
                       "margin": (price - total) if (price is not None and not missing) else None,
                       "planned": q, "plan_cost": total * q, "lines": lines})
    shortfall_cost, shortfall_lines = 0.0, []
    for r in feas["materials"]:
        if r["shortfall"]:
            c = prices.get(r["part"], {}).get("unit_cost")
            shortfall_lines.append({"part": r["part"], "shortfall": r["shortfall"], "unit_cost": c,
                                    "first_short_week": r["first_short_week"],
                                    "cost": r["shortfall"] * c if c is not None else None})
            if c is not None:
                shortfall_cost += r["shortfall"] * c
    at_risk = None
    if plan and feas["feasible"] is not None:
        units = {r["fg"]: r["unmet"] for r in feas["finished_goods"]}
        have = all(prices.get(f, {}).get("selling_price") is not None for f in units)
        late_units = sum(t["late_filled"] for t in feas["weeks"])
        at_risk = {"units": units, "units_total": sum(units.values()), "late_units": late_units,
                   "dollars": sum(units[f] * prices[f]["selling_price"] for f in units) if have else None}
    plan_cost = sum(x["plan_cost"] for x in per_fg)
    plan_scrap = sum(x["scrap_cost"] * x["planned"] for x in per_fg)
    if not per_fg:
        answer = "No finished goods to cost yet."
    elif missing_all:
        answer = "Partial: unit cost missing for %d materials." % len(missing_all)
    elif plan:
        answer = "The %d-week plan uses $%s of materials, including $%s of scrap." % (
            HORIZON, format(round(plan_cost), ","), format(round(plan_scrap), ","))
    else:
        answer = "Unit material costs calculated for %d finished goods." % len(per_fg)
    return {"answer": answer, "per_fg": per_fg, "plan_cost": plan_cost, "plan_scrap_cost": plan_scrap,
            "shortfall_cost": shortfall_cost, "shortfall_lines": shortfall_lines,
            "missing_costs": sorted(missing_all), "at_risk": at_risk}


# ---------------------------------------------------------------------------
# 10. Readiness
# ---------------------------------------------------------------------------

def readiness(model, ti, feas):
    out = {}
    blocked = None
    if model["graph"].number_of_edges() == 0:
        blocked = {"status": "blocked", "missing": [{"what": "BOM lines", "parts": []}],
                   "message": "Load at least one BOM tab and confirm its column mapping."}
    elif model["cycles"]:
        blocked = {"status": "blocked", "missing": [{"what": "Fix loops in the BOM", "parts": []}],
                   "message": "The BOM contains a loop, so no quantities can be calculated."}
    for mod in ("feasibility", "cost"):
        if blocked:
            out[mod] = blocked
            continue
        missing = []
        dem_fgs = [r["fg"] for r in feas["finished_goods"]] if feas else []
        bad = sorted(f for f in dem_fgs if f in model["fg_blocked"])
        if model["fg_blocked"]:
            missing.append({"what": "Fix data errors for " + ", ".join(sorted(model["fg_blocked"])),
                            "parts": sorted({p for v in model["fg_blocked"].values() for p in v})})
        if feas and not dem_fgs:
            missing.append({"what": "Weekly demand for at least one finished good", "parts": [],
                            "field": "demand"})
        if mod == "feasibility" and feas and feas["unknown_stock"]:
            missing.append({"what": "Available stock for %d of %d raw materials"
                            % (len(feas["unknown_stock"]), len(feas["materials"])),
                            "parts": feas["unknown_stock"], "field": "available"})
        if mod == "cost" and feas:
            c = cost(model, feas)
            n = len({m for x in c["per_fg"] for m in _fg_leaves(model, x["fg"])})
            if c["missing_costs"]:
                missing.append({"what": "Unit cost for %d of %d raw materials" % (len(c["missing_costs"]), n),
                                "parts": c["missing_costs"], "field": "unit_cost"})
            np_ = [x["fg"] for x in c["per_fg"] if x["selling_price"] is None]
            if np_:
                missing.append({"what": "Selling price for %d finished goods (needed for revenue at risk)"
                                % len(np_), "parts": np_, "field": "selling_price"})
        out[mod] = {"status": "partial" if missing else "ready", "missing": missing,
                    "message": "; ".join(m["what"] for m in missing)}
    return out

# 11. Public API
# ---------------------------------------------------------------------------

def _loads(s):
    """Objects arrive as JSON text from JavaScript; plain IDs arrive as strings."""
    if isinstance(s, str) and s[:1] in ("{", "["):
        return json.loads(s)
    return s


def _issue_summary(model):
    c = Counter(i["severity"] for i in model["issues"])
    return {"errors": c.get("error", 0), "warnings": c.get("warning", 0), "info": c.get("info", 0)}


_ANALYZE_CACHE = {}


def analyze(state):
    """Results are pure functions of the inputs, so they are cached per input."""
    state = _loads(state)
    model = get_model(state)
    ov = state.get("overrides") or {}
    key = json.dumps([ov.get("demand"), ov.get("receipts")], sort_keys=True, default=str)
    if _ANALYZE_CACHE.get("model") is not model:
        _ANALYZE_CACHE.clear()
        _ANALYZE_CACHE["model"] = model
    if key not in _ANALYZE_CACHE:
        _ANALYZE_CACHE[key] = _analyze(state, model)
    return _ANALYZE_CACHE[key]


def _analyze(state, model):
    out = {"engine": ENGINE_VERSION, "horizon": HORIZON, "issues": model["issues"],
           "issue_summary": _issue_summary(model), "finished_goods": model["roots"],
           "raw_materials": model["leaves"], "part_count": model["graph"].number_of_nodes(),
           "line_count": model["line_count"], "edge_count": model["graph"].number_of_edges(),
           "fg_blocked": model["fg_blocked"], "parts": model["parts"], "prices": model["prices"],
           "inventory": model["inventory"]}
    if model["cycles"] or model["graph"].number_of_edges() == 0:
        out["readiness"] = readiness(model, None, None)
        out["blocked"] = True
        return out
    ti = time_inputs(state, model)
    feas = feasibility(model, ti)
    out.update({"weeks": ti["labels"], "demand": ti["demand"], "receipts": ti["receipts"],
                "time_notes": ti["notes"], "has_demand_tab": ti["has_demand_tab"],
                "has_receipts_tab": ti["has_receipts_tab"], "feasibility": feas,
                "cost": cost(model, feas), "readiness": readiness(model, ti, feas), "blocked": False})
    return out


def _plan_totals(state, model):
    a = analyze(state)
    return {r["fg"]: r["demand"] for r in (a.get("feasibility") or {}).get("finished_goods", [])}


def trace(state, material):
    """The arithmetic behind one material's requirement over the horizon, path by path."""
    state = _loads(state)
    model = get_model(state)
    g = model["graph"]
    material = normalize_id(material)
    plan = _plan_totals(state, model)
    paths, total, n_paths = [], 0.0, 0
    for fg in sorted(plan):
        if not plan[fg] or material not in g or material not in model["desc"].get(fg, ()):
            continue
        total += plan[fg] * per_unit(model, fg).get(material, 0.0)
        cnt = {fg: 1}
        for node in nx.topological_sort(g.subgraph(model["desc"][fg] | {fg})):
            for c in g.successors(node):
                cnt[c] = cnt.get(c, 0) + cnt.get(node, 0)
        n_paths += cnt.get(material, 0)
        for p in nx.all_simple_paths(g, fg, material):
            if len(paths) >= 25:
                break
            steps, prod = [], 1.0
            for a, b in zip(p, p[1:]):
                e = g.edges[a, b]
                steps.append({"parent": a, "child": b, "qty_per": e["qty_per"], "uom": e["uom"],
                              "conversion": e["conv_used"], "scrap": e["scrap"], "ratio": e["ratio"],
                              "source": e["source"], "row": e["row"]})
                prod *= e["ratio"]
            paths.append({"fg": fg, "fg_qty": plan[fg], "steps": steps, "result": plan[fg] * prod})
    weekly = next((r for r in analyze(state)["feasibility"]["materials"] if r["part"] == material), None)
    return {"material": material, "uom": model["base_uom"].get(material, ""), "total": total,
            "paths": paths, "path_count": n_paths, "truncated": n_paths > len(paths), "weekly": weekly}


def where_used(state, part):
    state = _loads(state)
    model = get_model(state)
    g = model["graph"]
    part = normalize_id(part)
    if part not in g:
        return {"part": part, "found": False}
    anc = nx.ancestors(g, part)
    return {"part": part, "found": True, "finished_goods": sorted(a for a in anc if a in model["roots"]),
            "assemblies": sorted(a for a in anc if a not in model["roots"]),
            "components": sorted(nx.descendants(g, part))}


def graph_data(state, fg=None):
    """Nodes, edges, the structure tree for one finished good, and Sankey links (by cost)."""
    state = _loads(state)
    model = get_model(state)
    g = model["graph"]
    if model["cycles"]:
        return {"nodes": [], "edges": [], "trees": {}, "sankey": None}
    a = analyze(state)
    plan = _plan_totals(state, model)
    status = {r["part"]: r["overall"] for r in (a.get("feasibility") or {}).get("materials", [])}
    depth = {}
    for n in nx.topological_sort(g):
        preds = list(g.predecessors(n))
        depth[n] = 0 if not preds else max(depth[p] + 1 for p in preds)
    req = explode(model, {f: q for f, q in plan.items() if q})
    nodes = []
    for n in sorted(g.nodes):
        kind = "fg" if n in model["roots"] else ("raw" if g.out_degree(n) == 0 else "assembly")
        nodes.append({"id": n, "kind": kind, "level": depth.get(n, 0),
                      "description": model["parts"].get(n, {}).get("description", ""),
                      "status": status.get(n, "none"), "required": req.get(n, 0.0),
                      "blocked": n in model["fg_blocked"]})
    edges = [{"source": u, "target": v, "qty_per": d["qty_per"], "ratio": d["ratio"],
              "uom": d["uom"], "scrap": d["scrap"]} for u, v, d in sorted(g.edges(data=True))]

    # Each assembly is expanded once per tree; later uses show as a "see above" leaf.
    def build_tree(root):
        expanded, count = set(), [0]

        def tree(n, mult):
            count[0] += 1
            node = {"name": n, "qty": mult, "status": status.get(n, "none"),
                    "description": model["parts"].get(n, {}).get("description", ""), "children": []}
            if g.out_degree(n) and (n in expanded or count[0] > 1500):
                node["repeat"] = True
                return node
            expanded.add(n)
            for c in sorted(g.successors(n)):
                node["children"].append(tree(c, mult * g.edges[n, c]["ratio"]))
            return node
        return tree(root, plan.get(root) or 1.0)

    tree_fg = fg if fg in model["roots"] else (model["roots"][0] if model["roots"] else None)
    trees = {tree_fg: build_tree(tree_fg)} if tree_fg else {}

    # Sankey in dollars; unknown unit costs count as 0 and the view is marked partial.
    prices = model["prices"]
    rolled, partial = {}, False
    for n in reversed(list(nx.topological_sort(g))):
        if g.out_degree(n) == 0:
            c = prices.get(n, {}).get("unit_cost")
            rolled[n] = c if c is not None else 0.0
        else:
            rolled[n] = sum(g.edges[n, c]["ratio"] * rolled[c] for c in g.successors(n))
    edge_flow = defaultdict(float)
    for f, q in plan.items():
        if not q or f in model["fg_blocked"]:
            continue
        pu = per_unit(model, f)
        for u, v in g.subgraph(model["desc"][f] | {f}).edges:
            edge_flow[(u, v)] += q * pu.get(u, 0.0) * g.edges[u, v]["ratio"]
    links = []
    for (u, v), units in sorted(edge_flow.items()):
        if g.out_degree(v) == 0 and "unit_cost" not in prices.get(v, {}):
            partial = True
        if units * rolled.get(v, 0.0) > 0:
            links.append({"source": v, "target": u, "value": units * rolled[v]})
    return {"nodes": nodes, "edges": edges, "trees": trees,
            "sankey": {"links": links, "partial": partial}, "plan": plan}


def api(fn, *args):
    """Single JSON entry point used from JavaScript: api('analyze', state)."""
    funcs = {"propose_mapping": propose_mapping, "map_columns": map_columns, "schema": schema,
             "analyze": analyze, "trace": trace, "where_used": where_used, "graph_data": graph_data}
    try:
        args = [_loads(a) for a in args]
        return json.dumps({"ok": True, "result": funcs[fn](*args)}, default=_json_default)
    except Exception as exc:  # surfaced in the UI, never swallowed
        import traceback
        return json.dumps({"ok": False, "error": "%s: %s" % (type(exc).__name__, exc),
                           "trace": traceback.format_exc()})


def _json_default(o):
    if isinstance(o, set):
        return sorted(o)
    return str(o)

"use strict";
/* ======================================================================
   BOM Gap Analyzer: interface layer.
   All calculations happen in the Python engine (Pyodide). This file only
   collects inputs, calls engine.api(...) and draws the results.
   ====================================================================== */
const APP_ID = "bom-gap-analyzer", FILE_VERSION = 2;
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/";
const COLORS = {red:"#D64545", amber:"#D99A00", green:"#2E9E6B", unknown:"#A0AAB8", none:"#A0AAB8",
  accent:"#2457D6", ink:"#14213D", ink2:"#4A5568", grid:"#E3E8EF", fg:"#2457D6", assembly:"#6B7A99", raw:"#2E9E6B"};
const STATUS_LABEL = {red:"Short", amber:"Tight", green:"Covered", unknown:"No stock data", none:"–"};
const FIELD_LABEL = {parent:"Parent part", child:"Child part", part_id:"Part", qty_per:"Quantity per",
  child_uom:"Unit", uom:"Unit", scrap_factor:"Scrap factor (×)", scrap_pct:"Scrap %", yield_pct:"Yield %",
  uom_conversion:"Unit conversion", level:"Level", available_qty:"Available qty", unit_cost:"Unit cost",
  selling_price:"Selling price", description:"Description", part_type:"Type", base_uom:"Base unit",
  week:"Week or date", demand_qty:"Demand qty", receipt_qty:"Receipt qty"};
const KIND_LABEL = {bom:"BOM (parent / child)", indented:"Indented BOM (levels)", inventory:"Available stock",
  prices:"Costs and prices", parts:"Part master", demand:"Weekly demand", receipts:"Scheduled receipts (POs)",
  ignore:"Ignore this tab"};

const S = { state:null, result:null, graph:null, page:"data", engine:null, py:null,
  solver:"loading", fileHandle:null, savedAt:null, autosavedAt:null, autosaveOk:true, dirty:false,
  briefing:[], charts:[], cy:null, schema:null, ui:{sort:{}, filter:{}, colmenu:null, explorerFg:null, explorerView:"tree",
  costFg:null, treeOrient:"TB", mapOpen:false, weeklyFg:"__all", balanceMat:null, heatAll:false} };

function newState(){
  return {app:APP_ID, version:FILE_VERSION, name:"Untitled project", tabs:[], mappings:{},
    fixes:{aliases:{}, conversions:{}, qty:{}, excluded:[], duplicates:{}},
    overrides:{available:{}, unit_cost:{}, selling_price:{}, demand:{}, receipts:{}},
    settings:{decimals:2, columns:{}}};
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dec = () => S.state?.settings?.decimals ?? 2;
function fmt(v, d = dec()){ if(v===null||v===undefined||Number.isNaN(v)) return "–";
  return Number(v).toLocaleString(undefined,{maximumFractionDigits:d}); }
function fmtInt(v){ return v==null ? "–" : Math.round(v).toLocaleString(); }
function fmtPct(v){ return v==null ? "–" : (v*100).toLocaleString(undefined,{maximumFractionDigits:1})+"%"; }
function money(v, d = 0){ if(v==null) return "–"; const s = Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); return (v<0?"-$":"$")+s; }
function moneyShort(v){ if(v==null) return "–"; const a=Math.abs(v); if(a>=1e6) return "$"+(v/1e6).toFixed(2)+"M"; if(a>=1e4) return "$"+(v/1e3).toFixed(1)+"K"; return money(v, a<100?2:0); }
function desc(p){ return S.result?.parts?.[p]?.description || ""; }
function plabel(p){ const d = desc(p); return d ? `${p} · ${d}` : p; }
function toast(msg, ms = 2600){ const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function sources(){ return [...new Set(S.state.tabs.map(t=>t.file))].join(", ") || "none"; }

/* ---------- engine bridge ---------- */
function call(fn, ...args){
  if(!S.engine) throw new Error("Engine not ready");
  const a = args.map(x => typeof x === "string" ? x : JSON.stringify(x));
  const out = JSON.parse(S.engine.api(fn, ...a));
  if(!out.ok){ console.error(out.trace); throw new Error(out.error); }
  return out.result;
}

async function boot(){
  const bar = $("#splash-bar"), msg = $("#splash-msg");
  const step = (p, m) => { bar.style.width = p + "%"; msg.textContent = m; };
  try{
    if(typeof loadPyodide !== "function" || typeof echarts === "undefined" || typeof XLSX === "undefined")
      throw new Error("libraries");
    step(15, "Loading the Python runtime (first open takes a few seconds)");
    S.py = await loadPyodide({indexURL: PYODIDE_URL});
    step(60, "Loading NetworkX");
    // Load the NetworkX wheel directly so Pyodide does not pull in matplotlib.
    await S.py.loadPackage(PYODIDE_URL + "networkx-3.4.2-py3-none-any.whl");
    step(85, "Starting the calculation engine");
    S.py.FS.writeFile("/home/pyodide/engine.py", $("#engine-src").textContent);
    S.engine = S.py.pyimport("engine");
    S.schema = call("schema");
    step(100, "Ready");
  }catch(err){
    console.error(err);
    $("#splash").innerHTML = `<div class="box"><div class="kicker">Can't start</div><h2>The calculation engine didn't load</h2>
      <p class="muted">This tool downloads its Python engine and chart libraries from public CDNs the first time it opens, so it needs an internet connection. Corporate networks sometimes block <b>cdn.jsdelivr.net</b>. Check your connection, then reload.</p>
      <p class="muted small">Details: ${esc(err.message||err)}</p><button class="btn primary" onclick="location.reload()">Reload</button></div>`;
    return;
  }
  setPill("engine-pill","warn","Solver loading");
  const restored = await restoreAutosave();
  if(!restored) S.state = newState();
  $("#splash").remove();
  recompute(); render();
  if(restored) toast("Restored your last session");
  loadSolver();
}

/* ---------- persistence ---------- */
const IDB_NAME = "bom-gap-analyzer", IDB_STORE = "kv", IDB_KEY = "autosave";
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open(IDB_NAME, 1);
  r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(v, key = IDB_KEY){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(v, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(key = IDB_KEY){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(IDB_STORE,"readonly"); const q = tx.objectStore(IDB_STORE).get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
let autosaveTimer = null;
function scheduleAutosave(){ clearTimeout(autosaveTimer); autosaveTimer = setTimeout(async () => {
  try{ await idbSet(JSON.stringify(S.state)); S.autosaveOk = true; S.autosavedAt = new Date(); }
  catch(e){ S.autosaveOk = false; }
  updateSavePill(); }, 700); updateSavePill(); }
async function restoreAutosave(){ try{ const v = await idbGet(); if(!v) return false; const st = JSON.parse(v);
  if(st.app !== APP_ID) return false; S.state = migrate(st);
  try{ S.fileHandle = (await idbGet("handle")) || null; }catch(e){ S.fileHandle = null; }
  return true; }catch(e){ S.autosaveOk = false; return false; } }
function migrate(st){ const base = newState();
  // Version 1 projects carried scenarios; version 2 plans from the weekly demand signal instead.
  const {scenarios, activeScenario, compareIds, ...rest} = st;
  return Object.assign(base, rest, {version:FILE_VERSION, fixes:Object.assign(base.fixes, st.fixes||{}),
    overrides:Object.assign(base.overrides, st.overrides||{}), settings:Object.assign(base.settings, st.settings||{})}); }
function updateSavePill(){
  if(S.savedAt && !S.dirty) return setPill("save-pill","ok","Saved to file " + S.savedAt.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
  if(!S.autosaveOk) return setPill("save-pill","bad","Autosave off: save to file");
  if(S.autosavedAt) return setPill("save-pill", S.dirty && S.fileHandle ? "warn":"ok", (S.fileHandle && S.dirty ? "Unsaved changes · " : "") + "Autosaved " + S.autosavedAt.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
  setPill("save-pill","", "Not saved");
}
function projectBlob(){ return new Blob([JSON.stringify({app:APP_ID, version:FILE_VERSION, savedAt:new Date().toISOString(),
  note:"Inputs only. Results are recalculated when the file opens.", state:S.state}, null, 1)], {type:"application/json"}); }
function fileName(){ return (S.state.name || "project").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-") + ".bomproject.json"; }
async function saveProject(as = false){
  try{
    if(window.showSaveFilePicker){
      if(S.fileHandle && !as && S.fileHandle.requestPermission && (await S.fileHandle.requestPermission({mode:"readwrite"})) !== "granted") S.fileHandle = null;
      if(!S.fileHandle || as) S.fileHandle = await showSaveFilePicker({suggestedName:fileName(), types:[{description:"BOM project", accept:{"application/json":[".json"]}}]});
      idbSet(S.fileHandle, "handle").catch(() => {});

    } else { downloadBlob(projectBlob(), fileName()); }

async function loadProjectText(text, handle = null){
  let obj; try{ obj = JSON.parse(text); }catch(e){ return toast("That file isn't a project file."); }
  if(obj.app !== APP_ID || !obj.state) return toast("That file isn't a BOM Gap Analyzer project.");
  S.state = migrate(obj.state); S.fileHandle = handle; idbSet(handle, "handle").catch(() => {}); S.savedAt = new Date(); S.dirty = false; S.briefing = [];
  scheduleAutosave(); recompute(); render(); updateSavePill(); toast("Opened " + (S.state.name || "project"));
}
function downloadBlob(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); }

/* ---------- loading Excel ---------- */
async function addFiles(files){
  let added = 0;
  for(const f of files){
    try{
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, {type:"array", cellDates:false});
      for(const sheet of wb.SheetNames){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheet], {header:1, defval:null, raw:true, blankrows:false});
        const hi = rows.findIndex(r => r.filter(v => v !== null && v !== "").length >= 2);
        if(hi < 0) continue;
        let headers = rows[hi].map((h,i) => h==null || h==="" ? `Column ${i+1}` : String(h).trim());
        const seen = {}; headers = headers.map(h => seen[h] ? `${h} (${++seen[h]})` : (seen[h]=1, h));
        const data = rows.slice(hi+1).filter(r => r.some(v => v !== null && v !== ""));
        upsertTab({file:f.name, sheet, headers, rows:data}); added++;
      }
    }catch(e){ toast(`Couldn't read ${f.name}: ${e.message}`); }
  }
  if(added){ S.dirty = true; scheduleAutosave(); recompute(); render(); toast(`Loaded ${added} tab${added>1?"s":""}. Check the column mapping below.`); }
}
function upsertTab(t){
  const st = S.state, ex = st.tabs.find(x => x.file === t.file && x.sheet === t.sheet);
  if(ex){ const same = JSON.stringify(ex.headers) === JSON.stringify(t.headers); Object.assign(ex, t, {id:ex.id});
    if(!same) st.mappings[ex.id] = call("propose_mapping", ex); return; }
  const n = st.tabs.reduce((m,x) => Math.max(m, +String(x.id).replace(/\D/g,"") || 0), 0) + 1;
  const tab = Object.assign({id:"t"+n}, t); st.tabs.push(tab); st.mappings[tab.id] = call("propose_mapping", tab);
}
function loadDemo(){
  const demo = JSON.parse($("#demo-data").textContent);
  S.state = newState(); S.state.name = "Demo: medical device line"; S.fileHandle = null; idbSet(null, "handle").catch(() => {}); S.savedAt = null; S.briefing = [];
  for(const t of demo.tabs){ S.state.tabs.push(t); S.state.mappings[t.id] = call("propose_mapping", t); }
  S.dirty = true; scheduleAutosave(); recompute(); S.page = "data"; render();
  toast("Demo loaded. Fix the flagged data issues to unlock the analysis.", 3800);
}

/* Generic table with sort and column toggles.
   cols: [{k, label, num, fmt(row), sortv(row), hide(default hidden)}] */
function table(id, cols, rows, {click = null, title = "", note = "", maxh = true} = {}){
  const vis = S.state.settings.columns[id] || {};
  const shown = cols.filter(c => vis[c.k] ?? !c.hide);
  const sort = S.ui.sort[id];
  let data = rows.slice();
  if(sort){ const c = cols.find(x => x.k === sort.k); if(c){ const sv = c.sortv || (r => r[c.k]);
    data.sort((a,b) => { const x = sv(a), y = sv(b); const r = (x==null) - (y==null) || (x<y?-1:x>y?1:0); return sort.dir * r; }); } }
  const menu = S.ui.colmenu === id ? `<div class="pop">${cols.map(c => `<label><input type="checkbox" data-change="col-toggle" data-table="${id}" data-col="${c.k}" ${(vis[c.k] ?? !c.hide)?"checked":""}> ${esc(c.label)}</label>`).join("")}</div>` : "";
  return `<div class="tbar">${title?`<h3>${title}</h3>`:""}${note?`<span class="hint">${note}</span>`:""}<div class="spacer"></div>
    <input class="inp filter" style="width:170px;padding:4px 9px" placeholder="Filter rows" data-input="table-filter" data-table="${id}" value="${esc(S.ui.filter[id]||"")}">
    <div class="colmenu"><button class="btn small" data-action="colmenu" data-table="${id}">Columns</button>${menu}</div></div>
    <div class="${maxh?"tablewrap":""}"><table class="t" data-filter-table="${id}"><thead><tr>${shown.map(c => `<th class="${c.num?"num":""}" data-action="sort" data-table="${id}" data-col="${c.k}">${esc(c.label)}${sort?.k===c.k?(sort.dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead>
    <tbody>${data.map(r => `<tr class="${click?"click":""}" ${click?`data-action="${click}" data-part="${esc(r.part||r.fg||"")}"`:""}>${shown.map(c => `<td class="${c.num?"num":""}">${c.fmt ? c.fmt(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${shown.length}" class="muted">Nothing to show</td></tr>`}</tbody></table></div>`;
}

function networkElements(fg){

    nodes = nodes.filter(n=>keep.has(n.id)); edges = edges.filter(e=>keep.has(e.source)&&keep.has(e.target)); }
  return {nodes, elements:[...nodes.map(n=>({data:{id:n.id,label:n.id,kind:n.kind,status:n.status}})),...edges.map(e=>({data:{id:e.source+">"+e.target,source:e.source,target:e.target,label:"×"+fmt(e.ratio,3)}}))]};
